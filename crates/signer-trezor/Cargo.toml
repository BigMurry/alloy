[package]
name = "alloy-signer-trezor"
description = "Ethereum Trezor signer"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--show-type-layout",
]

[lints]
workspace = true

[dependencies]
alloy-consensus = { workspace = true, features = ["std"] }
alloy-network.workspace = true
alloy-primitives.workspace = true
alloy-signer.workspace = true

# eip712
alloy-sol-types = { workspace = true, optional = true }

trezor-client = { git = "https://github.com/BigMurry/trezor-firmware.git", branch = "feat/trezor-sign-typed", default-features = false, features = ["ethereum"]}

async-trait.workspace = true
semver.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
alloy-rpc-types-eth = { workspace = true, features = ["std", "serde"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
eip712 = ["alloy-signer/eip712", "dep:alloy-sol-types"]
